name: CI/CD to GCP - SiCuan Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: sicuan-boyz4
  REGION: asia-southeast2
  TOPIC_NAME: email-notifications
  FUNCTION_NAME: processEmailQueue
  SERVICE_NAME: sicuan-api
  GCR_IMAGE_NAME: gcr.io/sicuan-boyz4/sicuan-api

jobs:
  # ✅ CONTINUOUS INTEGRATION (TESTING)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for Express backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies (Express app)
        run: npm ci

      - name: Run tests (Express app)
        run: npm test || echo "⚠️ No tests configured for Express app."

      - name: Set up Node.js (Cloud Function)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./functions/email-processor/package-lock.json

      - name: Install dependencies (Cloud Function)
        run: npm ci
        working-directory: ./functions/email-processor

      - name: Run tests (Cloud Function)
        run: npm test || echo "⚠️ No tests configured for Cloud Function."
        working-directory: ./functions/email-processor

  # ✅ CONTINUOUS DEPLOYMENT
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set Google Cloud project config
        run: gcloud config set project ${{ env.PROJECT_ID }}

      - name: Enable required GCP APIs
        run: |
          gcloud services enable pubsub.googleapis.com \
                                  cloudfunctions.googleapis.com \
                                  run.googleapis.com \
                                  cloudbuild.googleapis.com

      - name: Create Pub/Sub topic if not exists
        run: |
          if ! gcloud pubsub topics describe ${{ env.TOPIC_NAME }} > /dev/null 2>&1; then
            echo "Creating topic ${{ env.TOPIC_NAME }}..."
            gcloud pubsub topics create ${{ env.TOPIC_NAME }}
          else
            echo "Topic ${{ env.TOPIC_NAME }} already exists."
          fi

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --runtime nodejs20 \
            --trigger-topic ${{ env.TOPIC_NAME }} \
            --source functions/email-processor \
            --entry-point processEmailQueue \
            --region ${{ env.REGION }} \
            --memory 1GB \
            --timeout 60s \
            --set-env-vars MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }},MAILJET_SECRET_KEY=${{ secrets.MAILJET_SECRET_KEY }},MAILJET_SENDER=${{ secrets.MAILJET_SENDER }}

      - name: Build and Push Docker Image to GCR
        run: |
          gcloud builds submit --tag ${{ env.GCR_IMAGE_NAME }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCR_IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2G \
            --cpu 1 \
            --max-instances 5 \
            --timeout 300

      - name: Get Cloud Run URL
        id: run-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --format='value(status.url)')
          echo "CLOUD_RUN_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: 🎉 Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Cloud Run URL: ${{ steps.run-url.outputs.url }}"
