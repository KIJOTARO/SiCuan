name: CI/CD Backend to GCP

on:
  push:
    branches:
      - main # Trigger workflow on push to 'main'
  pull_request:
    branches:
      - main # Run tests on Pull Requests

env:
  # General environment variables for the workflow
  PROJECT_ID: sicuan-boyz4
  REGION: asia-southeast2
  TOPIC_NAME: email-notifications
  FUNCTION_NAME: processEmailQueue
  SERVICE_NAME: sicuan-api
  GCR_IMAGE_NAME: gcr.io/${{ vars.PROJECT_ID }}/${{ vars.SERVICE_NAME }} # Define image name once

jobs:
  # --- AUTOMATED TESTING JOB (CI) ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Main Application (Cloud Run) Testing ---
      - name: Set up Node.js for main app
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ensure this matches your app's Node.js version
          cache: 'npm'
          cache-dependency-path: src/package-lock.json # Specific cache path for main app

      - name: Install dependencies (main app)
        run: npm install # Or `yarn install`, `pnpm install`
        working-directory: ./src # Run in your main app's directory

      - name: Run unit tests (main app)
        run: npm test # Or your specific test command, e.g., `jest`
        working-directory: ./src

      # --- Cloud Function (Email Processor) Testing ---
      - name: Set up Node.js for Cloud Function
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ensure this matches your Cloud Function's Node.js version
          cache: 'npm'
          cache-dependency-path: functions/email-processor/package-lock.json # Specific cache path for function

      - name: Install dependencies (Cloud Function)
        run: npm install
        working-directory: ./functions/email-processor

      - name: Run tests (Cloud Function)
        run: npm test
        working-directory: ./functions/email-processor

  # --- DEPLOYMENT JOB (CD) ---
  deploy:
    needs: test # This ensures 'deploy' only runs if 'test' succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Google GitHub Actions authentication

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        project_id: ${{ env.PROJECT_ID }}
        # Note: If you switch to Workload Identity Federation, this step changes significantly.

    # --- Enable Required GCP APIs ---
    - name: Enable GCP APIs
      run: |
        gcloud services enable pubsub.googleapis.com
        gcloud services enable cloudfunctions.googleapis.com
        gcloud services enable run.googleapis.com
        gcloud services enable cloudbuild.googleapis.com
      env:
        CLOUDSDK_CORE_PROJECT: ${{ env.PROJECT_ID }} # Ensure gcloud operates on the correct project

    # --- Create/Verify Pub/Sub Topic ---
    - name: Create Pub/Sub topic
      run: |
        if ! gcloud pubsub topics describe ${{ env.TOPIC_NAME }} --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
          echo "Creating Pub/Sub topic ${{ env.TOPIC_NAME }}..."
          gcloud pubsub topics create ${{ env.TOPIC_NAME }} --project=${{ env.PROJECT_ID }}
          echo "Topic ${{ env.TOPIC_NAME }} created."
        else
          echo "Topic ${{ env.TOPIC_NAME }} already exists."
        fi

    # --- Deploy Cloud Function ---
    - name: Deploy Cloud Function
      run: |
        gcloud functions deploy ${{ env.FUNCTION_NAME }} \
          --runtime nodejs20 \
          --trigger-topic ${{ env.TOPIC_NAME }} \
          --source functions/email-processor \
          --entry-point processEmailQueue \
          --set-env-vars MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }},MAILJET_SECRET_KEY=${{ secrets.MAILJET_SECRET_KEY }},MAILJET_SENDER=${{ secrets.MAILJET_SENDER }} \
          --region ${{ env.REGION }} \
          --memory 1GB \
          --timeout 60s \
          --project=${{ env.PROJECT_ID }}
      working-directory: . # Ensure this runs from the root of the repo

    # --- Build and Push Docker Image ---
    - name: Build and push Docker Image
      run: |
        gcloud builds submit --tag ${{ env.GCR_IMAGE_NAME }} . \
          --project=${{ env.PROJECT_ID }}

    # --- Deploy Cloud Run Service ---
    - name: Deploy Cloud Run service
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.GCR_IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --memory 2G \
          --cpu 1 \
          --max-instances 5 \
          --timeout 300 \
          --project=${{ env.PROJECT_ID }}

    - name: Get Cloud Run Service URL
      id: get_service_url
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --project=${{ env.PROJECT_ID }} \
          --region=${{ env.REGION }} \
          --format='value(status.url)')
        echo "CLOUD_RUN_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
        echo "🌐 Cloud Run Service URL: $SERVICE_URL"

    - name: Display deployment information
      run: |
        echo "--- Deployment Complete ---"
        echo "Cloud Function: ${{ env.FUNCTION_NAME }}"
        echo "Cloud Run Service: ${{ env.SERVICE_NAME }}"
        echo "Service URL: ${{ steps.get_service_url.outputs.CLOUD_RUN_URL }}"
        echo "Region: ${{ env.REGION }}"
        echo "---------------------------"
        echo "Next steps:"
        echo "1. Update your frontend to use: ${{ steps.get_service_url.outputs.CLOUD_RUN_URL }}"
        echo "2. Test the API endpoints and OTP functionality."
        echo "3. Monitor logs in GCP Console or via gcloud CLI."
