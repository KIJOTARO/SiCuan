name: CI/CD to GCP - SiCuan Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: sicuan-boyz4
  REGION: asia-southeast2
  TOPIC_NAME: email-notifications
  FUNCTION_NAME: processEmailQueue
  SERVICE_NAME: sicuan-api
  GCR_IMAGE_NAME: gcr.io/sicuan-boyz4/sicuan-api

jobs:
  # ✅ CONTINUOUS INTEGRATION
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package.json

      - run: npm install
      - run: npm test || echo "⚠ No tests configured for Express app."

      - name: Set up Node.js (Cloud Function)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./functions/email-processor/package-lock.json

      - run: npm install
        working-directory: ./functions/email-processor

      - run: npm test || echo "⚠ No tests configured for Cloud Function."
        working-directory: ./functions/email-processor

  # ✅ CONTINUOUS DEPLOYMENT
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.MAILJET_API_KEY }}" ] || [ -z "${{ secrets.MAILJET_SECRET_KEY }}" ] || [ -z "${{ secrets.MAILJET_SENDER }}" ]; then
            echo "❌ MAILJET credentials are missing!"
            exit 1
          fi

      - run: gcloud config set project ${{ env.PROJECT_ID }}

      - name: Enable required GCP APIs
        run: |
          gcloud services enable pubsub.googleapis.com \
                                  cloudfunctions.googleapis.com \
                                  run.googleapis.com \
                                  cloudbuild.googleapis.com

      - name: Create Pub/Sub topic if not exists
        run: |
          if ! gcloud pubsub topics describe ${{ env.TOPIC_NAME }} > /dev/null 2>&1; then
            gcloud pubsub topics create ${{ env.TOPIC_NAME }}
          fi

      - name: Cancel any pending Cloud Function operations
        run: |
          PENDING_OPS=$(gcloud functions operations list \
            --region=${{ env.REGION }} \
            --filter="metadata.target=${{ env.FUNCTION_NAME }} AND done=false" \
            --format="value(name)")
          if [ ! -z "$PENDING_OPS" ]; then
            echo "⚠ Found pending operations. Canceling..."
            for OP in $PENDING_OPS; do
              gcloud functions operations cancel "$OP" --region=${{ env.REGION }}
            done
          else
            echo "✅ No pending operations found."
          fi

      - name: Deploy Cloud Function (with retry)
        run: |
          for i in {1..3}; do
            gcloud functions deploy ${{ env.FUNCTION_NAME }} \
              --runtime nodejs20 \
              --trigger-topic ${{ env.TOPIC_NAME }} \
              --source functions/email-processor \
              --entry-point processEmailQueue \
              --region ${{ env.REGION }} \
              --memory 1GB \
              --timeout 60s \
              --set-env-vars MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }},MAILJET_SECRET_KEY=${{ secrets.MAILJET_SECRET_KEY }},MAILJET_SENDER=${{ secrets.MAILJET_SENDER }} && break || {
              echo "⚠ Retry in 15 seconds..."
              sleep 15
            }
          done

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag ${{ env.GCR_IMAGE_NAME }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCR_IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2G \
            --cpu 1 \
            --max-instances 5 \
            --timeout 300

      - name: Get Cloud Run URL
        id: run-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} --format='value(status.url)')
          echo "CLOUD_RUN_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: 🎉 Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Cloud Run URL: ${{ steps.run-url.outputs.url }}"
          echo "📝 Function: ${{ env.FUNCTION_NAME }}"
          echo "📝 Service: ${{ env.SERVICE_NAME }}"
          echo "📝 Region: ${{ env.REGION }}"
